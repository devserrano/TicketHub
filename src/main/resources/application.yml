spring:
  application:
    name: tickethub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tickethub}
    username: ${DB_USERNAME:tickethub}
    password: ${DB_PASSWORD:tickethub}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo manda Flyway, Hibernate solo valida
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@tickethub.local}
  jwt:
    secret: ${JWT_SECRET:cambia-este-secreto-en-produccion-debe-tener-32-bytes-o-mas}
    expiration-minutes: 60
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:tickethub-attachments}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
  attachments:
    max-files-per-ticket: 5
    allowed-types: image/jpeg,image/png,application/pdf
