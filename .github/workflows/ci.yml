name: CI

on:
  push:
    branches: [master, integracion]
  pull_request:
    branches: [master, integracion]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y correr pruebas
        run: mvn -B verify
