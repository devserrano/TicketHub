# Servicios de apoyo para desarrollo local.
#   Solo infraestructura (corres la API desde IntelliJ):  docker compose up -d
#   Todo, incluida la API en contenedor:                   docker compose --profile app up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: tickethub-db
    environment:
      POSTGRES_DB: tickethub
      POSTGRES_USER: tickethub
      POSTGRES_PASSWORD: tickethub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickethub -d tickethub"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tickethub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    volumes:
      - miniodata:/data

  # Crea el bucket de adjuntos una sola vez al levantar
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/tickethub-attachments;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: tickethub-mail
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # bandeja web: http://localhost:8025

  api:
    profiles: ["app"]
    build: .
    container_name: tickethub-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tickethub
      DB_USERNAME: tickethub
      DB_PASSWORD: tickethub
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      S3_ENDPOINT: http://minio:9000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
